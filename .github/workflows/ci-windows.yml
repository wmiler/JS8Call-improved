name: CI Build for Windows 10+ x64

on: 
  workflow_dispatch: 
  pull_request:
  workflow_call:
    inputs:
      build-type:
        description: 'Build type (Debug/Release)'
        required: false
        type: string
        default: 'Release'
      release-ver:
        description: 'Release Version (v2.4.1)'
        required: false
        type: string      
        default: 'v2.4.1'        
env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build_windows-2025:
    runs-on: windows-2025
    permissions: write-all

    steps:
    - run: git config --global core.autocrlf input
    - uses: actions/checkout@v5
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        cache: true
        install: >-
          git python base-devel make unzip zip tar
        pacboy: >-
          toolchain:p
          autotools:p
          cmake:p
          ninja:p
          libusb:p
          wget:p
          boost:p
          fftw:p
          sqlite3:p
          nsis:p
          python:p

    - name: Setup build directory
      shell: msys2 {0}
      run: mkdir -p build

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9.3'
        target: 'desktop'
        arch: 'win64_mingw'
        modules: 'qtmultimedia qtserialport'
        cache: true
        dir: 'D:/a/JS8Call-improved/JS8Call-improved/local/qt693'

# Need to rework this and just grab it from hamlib/hamlib, but paths need adjusting for that to happen
    - name: Release download for hamlib
      uses: robinraju/release-downloader@v1.12
      with:
        repository: 'wmiler/js8call'
        fileName: 'hamlib-windows-msys2-binaries*.zip'
        tag: 'hamlib-v4.6.4-ci'
        extract: true
        out-file-path: 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib464'

    - name: Just need 3 dlls from this hamlib
      uses: robinraju/release-downloader@v1.12
      with:
        repository: 'hamlib/hamlib'
        fileName: 'hamlib-w64-4.6.4.zip'
        tag: '4.6.4'
        extract: true
        out-file-path: 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib464-bin'

    - name: Reconfig the paths from hamlib/hamlib
      shell: msys2 {0}
      run: |
        ls -l 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib464-bin/'
        mv 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib464-bin/hamlib-w64-4.6.4/*' 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib464-bin/'
        ls -l 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib464-bin/'
        
    - name: Configure JS8Call
      shell: msys2 {0}
      run: |
        cd ./build
        cmake -DCMAKE_PREFIX_PATH='D:/a/JS8Call-improved/JS8Call-improved/local/hamlib464;D:/a/JS8Call-improved/JS8Call-improved/local/qt693/Qt/6.9.3/mingw_64' ..
# End rework

    - name: Build JS8Call
      shell: msys2 {0}
      run: |
        cd ./build
        cmake --build . --config Release

    - name: Move exe into install directory
      shell: msys2 {0}
      run: |
        cp ./build/JS8Call-improved.exe ./build/JS8Call-improved/
        
    - name: Move libraries and License to install directory
      shell: msys2 {0}
      run: |
        cd ./build/
        cp 'D:/a/JS8Call-improved/JS8Call-improved/LICENSE' JS8Call-improved/
        cp 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib464-bin/hamlib-w64-4.6.4/bin/libhamlib-4.dll' JS8Call-improved/
        cp 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib464-bin/hamlib-w64-4.6.4/bin/libusb-1.0.dll' JS8Call-improved/
        cp 'D:/a/JS8Call-improved/JS8Call-improved/local/hamlib464-bin/hamlib-w64-4.6.4/bin/libwinpthread-1.dll' JS8Call-improved/
        cp /mingw64/bin/libfftw3f-3.dll JS8Call-improved/

    - name: INNO Setup    
      run: |
        cd ./build/
        & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' ../.github/workflows/windows-installer.iss
      continue-on-error: true

    - name: Look for installer output
      run: ls -l build/JS8Call-improved/
      
    - name: Upload Artifact (Release build)
      if: ${{ inputs.release-ver }}
      uses: actions/upload-artifact@v5
      with:
        name: "JS8call-improved_${{ inputs.release-ver }}_${{ runner.arch }}_win64"
        path: |
          ./build/JS8Call-improved/

    - name: Upload Artifact (Other build)
      if: ${{ !inputs.release-ver }}
      uses: actions/upload-artifact@v5
      with:
        name: "JS8call-improved_devel_${{ runner.arch }}_win64"
        path: |
          ./build/JS8Call-improved/
