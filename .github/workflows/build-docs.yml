name: Build and Deploy Docs
# Trigger only if we have labeled the PR, a Release has been published or a manual trigger
on: 
  workflow_dispatch: 
  pull_request:
    types: [labeled] 
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  pages: write
jobs:
  build_docs:
    if: (contains(github.event.pull_request.labels.*.name, 'documentation') ||
      (contains(github.event_name, 'workflow_dispatch')) ||
      (contains(github.event_name, 'release')) )
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Get doxygen and graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build docs on master
        if: (github.ref == 'refs/heads/master')
        run: (cat Doxyfile; echo "PROJECT_NUMBER=master"; echo "OUTPUT_DIRECTORY=html/master") | doxygen -

      - name: Build docs on a release branch
        if: (startsWith(github.ref_name, 'release/'))
        run: |
          cat (Doxyfile; echo "PROJECT_NUMBER=${{ github.ref_name }}"; echo "OUTPUT_DIRECTORY=html/${{ github.ref_name }}") | doxygen -

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

# Only run deploy if we are on master or a release branch
  deploy:
    if: (github.ref == 'refs/heads/master') ||
      (startsWith(github.ref_name, 'release/'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
